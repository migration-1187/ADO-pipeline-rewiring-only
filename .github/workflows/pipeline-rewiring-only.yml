name: Pipeline Rewiring Standalone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prerequisite-validation:
    name: Prerequisite Validation
    runs-on: ubuntu-latest

    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ADO_PAT: ${{ secrets.ADO_PAT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Environment Tokens
        run: |
          echo "=== Checking Required Secrets ==="

          if [ -z "${GH_PAT}" ]; then
            echo "::error::Missing secret GH_PAT"
            exit 1
          fi

          if [ -z "${ADO_PAT}" ]; then
            echo "::error::Missing secret ADO_PAT"
            exit 1
          fi

          echo "✅ Secret validation passed"

      - name: Validate pipelines.csv
        run: |
          echo "=== Checking bash/pipelines.csv ==="

          if [ ! -f "bash/pipelines.csv" ]; then
            echo "::error::bash/pipelines.csv not found"
            exit 1
          fi

          LINE_COUNT=$(wc -l < bash/pipelines.csv)
          echo "Lines: ${LINE_COUNT}"

          if [ "$LINE_COUNT" -le 1 ]; then
            echo "::error::pipelines.csv contains no data"
            exit 1
          fi

      - name: Validate repos_with_status.csv
        run: |
          echo "=== Checking repos_with_status.csv ==="

          if [ ! -f "bash/repos_with_status.csv" ]; then
            echo "::warning::repos_with_status.csv not found"
            echo "::warning::Script must handle fallback processing"
          else
            LINE_COUNT=$(wc -l < bash/repos_with_status.csv)
            echo "Lines: ${LINE_COUNT}"
          fi

  pipeline-rewiring:
    name: Pipeline Rewiring
    needs: prerequisite-validation
    runs-on: ubuntu-latest

    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ADO_PAT: ${{ secrets.ADO_PAT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update

          type -p curl >/dev/null || sudo apt-get install curl -y

          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg

          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg

          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null

          sudo apt-get update
          sudo apt-get install gh -y

          gh --version

      - name: Authenticate GitHub CLI
        run: |
          echo "${GH_PAT}" | gh auth login --with-token
          gh auth status

      - name: Install gh-ado2gh Extension
        run: |
          gh extension install github/gh-ado2gh || true

          gh extension list

          if ! gh extension list | grep -qi ado2gh; then
            echo "::error::gh-ado2gh extension not installed"
            exit 1
          fi

      - name: Fix Script Permissions
        run: |
          sed -i 's/\r$//' bash/4_rewire_pipeline.sh
          chmod +x bash/4_rewire_pipeline.sh

      - name: Display Input Files
        run: |
          echo "Current directory:"
          pwd

          echo "Contents:"
          ls -la
          ls -la bash

      - name: Execute Pipeline Rewiring
        run: |
          cd bash
          ./4_rewire_pipeline.sh

      - name: Cleanup Status File
        if: always()
        run: |
          rm -f repos_with_status.csv
          rm -f bash/repos_with_status.csv || true

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewiring-logs
          path: |
            *.txt
            bash/*.txt
          retention-days: 30

      - name: Rewiring Summary
        if: always()
        run: |
          echo "======================================"
          echo "PIPELINE REWIRING COMPLETED"
          echo "======================================"
          echo "Check workflow artifacts for logs"
